<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라임 키우기</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1e29;
    --panel-hi: #232735;
    --line: #2f3444;
    --text: #e7e9f0;
    --muted: #8b93a7;
    --accent: #7ef0b0;
    --accent-dim: #3d7a5c;
    --gold: #ffd36e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1d2233, var(--bg));
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
    /* 클리커는 연타가 기본이라 모바일 더블탭 확대를 막아야 한다 */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .game {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 18px;
  }
  @media (max-width: 760px) {
    .game { grid-template-columns: 1fr; }
  }

  h1 { font-size: 20px; margin: 0 0 14px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }

  /* ---- 슬라임 무대 ---- */
  .stage {
    position: relative;
    min-height: 300px;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
  }

  /* ---- 전투 무대 ---- */
  .stagetop {
    position: absolute; top: 12px; left: 14px; right: 14px; z-index: 2;
    display: flex; align-items: center; gap: 10px;
  }
  .floor {
    flex: none;
    font-size: 11px; font-weight: 700; color: var(--gold);
    background: #0006; border: 1px solid var(--line);
    border-radius: 99px; padding: 3px 9px;
    font-variant-numeric: tabular-nums;
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74px;
    background: linear-gradient(#191f2e, #131826);
    border-top: 1px solid #2b3346;
  }

  /* 슬라임 쪽 */
  /* --walk는 layoutArena가 화면을 실측해 px로 넣어 준다.
     화면 폭·슬라임 크기·몬스터 위치가 모두 변수라 고정 %로는 좁은 화면에서 겹친다.
     아래 값은 실측 전 첫 프레임에만 쓰이는 보수적인 기본값. */
  .stage { --walk: 18%; }
  .mover { position: absolute; left: 0; right: 0; bottom: 34px; }
  .mover.advancing { animation: advance 560ms cubic-bezier(0.35, 0.9, 0.4, 1) forwards; }
  @keyframes advance {
    from { transform: translateX(0); }
    to   { transform: translateX(var(--walk)); }
  }
  .unit {
    position: relative;
    width: 100px; margin-left: 2%;
    display: flex; flex-direction: column; align-items: center;
    /* 위아래 반동과 달려들기를 한 애니메이션에 합쳤다.
       transform은 요소당 하나만 살아남으므로 나눠 걸 수 없다. */
    animation: brawl 1100ms ease-in-out infinite;
  }
  @keyframes brawl {
    0%   { transform: translate(0, 0); }
    35%  { transform: translate(0, -7px); }
    55%  { transform: translate(15px, 0); }   /* 달려들어 때린다 */
    72%  { transform: translate(0, 0); }
    90%  { transform: translate(-8px, 0); }   /* 몬스터 반격에 밀린다 */
    100% { transform: translate(0, 0); }
  }

  /* 슬라임 머리 위 이름표 + 체력바. 몬스터 쪽과 폭을 맞춘다. */
  .tagwrap { width: 104px; margin-bottom: 7px; }
  .tagrow {
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
    margin-bottom: 4px; white-space: nowrap;
  }
  .lvtag { font-size: 11px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .shpnum { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .shp {
    height: 7px; background: #0d0f16;
    border: 1px solid var(--line); border-radius: 99px; overflow: hidden;
  }
  .shp > i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 160ms;
  }
  .shp.low > i { background: linear-gradient(90deg, #a34848, #ff7a7a); }

  .sizer { position: relative; transform-origin: 50% 100%; }

  /* 무기는 .sizer 안(슬라임과 같이 커짐) + .slime 밖(색조를 안 받음)에 둔다 */
  .weap {
    position: absolute; right: -12px; bottom: 14px;
    font-size: 21px; line-height: 1;
    transform-origin: 50% 85%;
    animation: swing 1100ms ease-in-out infinite;
  }
  /* 휘두르는 정점이 brawl의 달려들기(55%)와 겹치게 맞췄다 */
  @keyframes swing {
    0%, 38%  { transform: rotate(-14deg); }
    52%      { transform: rotate(-72deg); }
    64%      { transform: rotate(28deg); }
    82%, 100% { transform: rotate(-14deg); }
  }

  /* 몬스터 쪽 */
  .foe {
    position: absolute; right: 8%; bottom: 34px;
    display: flex; flex-direction: column; align-items: center;
  }
  .foe.entering { animation: foeIn 420ms ease-out; }
  @keyframes foeIn {
    from { transform: translateX(96px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  /* 체력바를 absolute로 띄워야 .foe의 폭이 몬스터 몸통만큼으로 유지된다.
     흐름에 두면 112px짜리 바가 .foe를 넓혀서 몬스터가 화면 안쪽으로 밀린다. */
  .hpwrap {
    position: absolute; bottom: 100%; left: 50%;
    transform: translateX(-50%);
    width: 112px; margin-bottom: 8px;
  }
  .ename {
    display: flex; justify-content: space-between; gap: 6px;
    font-size: 10px; color: var(--muted); margin-bottom: 4px;
    white-space: nowrap;
  }
  .ehpnum { font-variant-numeric: tabular-nums; }
  .ehp {
    height: 7px; background: #0d0f16;
    border: 1px solid var(--line); border-radius: 99px; overflow: hidden;
  }
  .ehp > i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #8c3b3b, #e06060);
    transition: width 160ms;
  }
  .ebody {
    font-size: 40px; line-height: 1;
    /* 슬라임과 같은 1100ms 주기. 맞고(62%) → 반격하고(88%)를 한 애니메이션에 담았다.
       transform은 요소당 하나만 살아남으므로 나눠 걸 수 없다. */
    animation: foeAct 1100ms ease-in-out infinite;
  }
  @keyframes foeAct {
    0%, 45% { transform: translate(0, 0) scale(1); filter: none; }
    50%     { transform: translate(0, -4px) scale(1); filter: none; }
    62%     { transform: translate(9px, 0) scale(0.93); filter: brightness(2.4) saturate(0.4); }
    78%     { transform: translate(0, 0) scale(1); filter: none; }
    88%     { transform: translate(-16px, -3px) scale(1.06); filter: none; }  /* 반격 */
    100%    { transform: translate(0, 0) scale(1); filter: none; }
  }
  /* 등급이 오를수록 몬스터에 기운이 돈다 */
  .foe.t1 { filter: drop-shadow(0 0 6px #7ef0b070); }
  .foe.t2 { filter: drop-shadow(0 0 7px #6ea8ff80); }
  .foe.t3 { filter: drop-shadow(0 0 8px #c07eff90); }
  .foe.t4 { filter: drop-shadow(0 0 10px #ffd36ea0); }

  .slainfx {
    position: absolute; left: 50%; bottom: 10px;
    transform: translateX(-50%);
    font-size: 30px; pointer-events: none;
    animation: slain 480ms ease-out forwards;
  }
  @keyframes slain {
    from { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
    to   { transform: translate(-50%, -34px) scale(1.5); opacity: 0; }
  }
  .slime {
    width: 92px;
    height: 74px;
    border-radius: 50% 50% 44% 44%;
    background: radial-gradient(circle at 38% 30%, #fff8, transparent 45%),
                linear-gradient(#5be39a, #2f9e6b);
    box-shadow: 0 12px 30px #0006, inset 0 -10px 20px #0003;
    transition: transform 90ms ease-out, filter 400ms;
    transform-origin: 50% 100%;
    position: relative;
  }
  .slime.squish { transform: scaleY(0.82) scaleX(1.12) !important; }

  /* 눈·입은 의사요소가 아니라 실제 요소로 둔다.
     아플 때 눈 하나를 "><"의 두 획으로 쪼개야 하는데,
     그러려면 눈마다 ::before/::after를 따로 써야 하기 때문이다. */
  .eye {
    position: absolute;
    top: 42%;
    width: 7px; height: 10px;
    border-radius: 50%;
    background: #12141c;
  }
  .eye.l { left: 30%; }
  .eye.r { right: 30%; }

  .mouth {
    position: absolute;
    top: 62%; left: 50%;
    width: 12px; height: 9px; margin-left: -6px;
    border-radius: 45% 45% 55% 55%;
    background: #12141c;
    transform: scale(0);
    transition: transform 110ms ease-out;
  }

  /* 맞은 자리가 붉게 달아오르는 기운.
     render()가 .slime의 inline filter를 매 프레임 덮어쓰므로
     filter로는 못 하고 별도 레이어로 처리한다. */
  .hurtglow {
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 42%, #ff5a5a70, transparent 68%);
    opacity: 0;
    transition: opacity 90ms;
    pointer-events: none;
  }

  /* ---- 아픈 표정 ---- */
  .slime.hurt .hurtglow { opacity: 1; }
  .slime.hurt .mouth    { transform: scale(1); }
  .slime.hurt .eye      { background: transparent; }
  .slime.hurt .eye::before, .slime.ko .eye::before,
  .slime.hurt .eye::after,  .slime.ko .eye::after {
    content: "";
    position: absolute;
    top: 50%; left: 0;
    width: 8px; height: 2.5px; margin-top: -1.25px;
    border-radius: 2px;
    background: #12141c;
  }
  /* 두 획이 한 점에서 만나도록 회전축을 꼭짓점에 둔다 → 왼눈 ">", 오른눈 "<" */
  .slime.hurt .eye.l::before, .slime.ko .eye.l::before { transform-origin: 100% 50%; transform: rotate(-32deg); }
  .slime.hurt .eye.l::after,  .slime.ko .eye.l::after  { transform-origin: 100% 50%; transform: rotate(32deg); }
  .slime.hurt .eye.r::before, .slime.ko .eye.r::before { transform-origin: 0 50%;    transform: rotate(32deg); }
  .slime.hurt .eye.r::after,  .slime.ko .eye.r::after  { transform-origin: 0 50%;    transform: rotate(-32deg); }

  /* 쓰러졌을 때 — 아픈 표정을 그대로 쓰되 축 늘어진다 */
  .slime.ko .hurtglow { opacity: 1; }
  .slime.ko .mouth    { transform: scale(1); }
  .slime.ko .eye      { background: transparent; }
  .slime.ko           { opacity: 0.5; }
  .stage.stunned .unit,
  .stage.stunned .ebody,
  .stage.stunned .weap { animation-play-state: paused; }
  .shadow {
    width: 100px; height: 12px; margin-top: -4px;
    border-radius: 50%;
    background: #0007;
    filter: blur(4px);
    flex: none;
  }
  .shadow.sm { width: 54px; height: 10px; margin-top: 2px; }
  .hint {
    color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .pop {
    position: absolute;
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    pointer-events: none;
    animation: rise 750ms ease-out forwards;
  }
  @keyframes rise {
    to { transform: translateY(-52px); opacity: 0; }
  }
  /* 크리티컬은 평타와 한눈에 구분돼야 손맛이 산다 */
  .pop.crit {
    color: var(--gold);
    font-size: 20px;
    text-shadow: 0 0 10px #ffd36e88;
    animation: rise-crit 850ms ease-out forwards;
  }
  @keyframes rise-crit {
    0%   { transform: translateY(0) scale(1.5); }
    100% { transform: translateY(-64px) scale(1); opacity: 0; }
  }

  /* ---- 터치 이펙트 ----
     연타가 기본인 장르라 이펙트 노드는 애니메이션이 끝나는 즉시 지운다.
     남겨 두면 몇 분 만에 수천 개가 쌓여 화면이 눈에 띄게 느려진다.
     transform/opacity만 움직여서 레이아웃 재계산을 피한다. */
  .fx { position: absolute; pointer-events: none; will-change: transform, opacity; }

  .ring {
    width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    animation: ring 420ms ease-out forwards;
  }
  .ring.crit { border-color: var(--gold); border-width: 3px; }
  @keyframes ring {
    from { transform: scale(0.4); opacity: 0.9; }
    to   { transform: scale(4.2); opacity: 0; }
  }

  .bit {
    width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px #7ef0b066;
    animation: bit 520ms cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
  }
  .bit.crit { background: var(--gold); box-shadow: 0 0 8px #ffd36e88; }
  /* --dx/--dy는 JS가 방울마다 다르게 넣어 준다 */
  @keyframes bit {
    from { transform: translate(0, 0) scale(1); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(0.25); opacity: 0; }
  }

  .flash {
    inset: 0;
    background: radial-gradient(circle at var(--fx) var(--fy), #ffd36e40, transparent 55%);
    animation: flash 340ms ease-out forwards;
  }
  @keyframes flash { to { opacity: 0; } }

  /* ---- 스탯 ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel-hi); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .bar { height: 8px; background: #0d0f16; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 160ms; }
  .barrow { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 12px 0 5px; font-variant-numeric: tabular-nums; }


  /* ---- 머리말 ---- */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .head h1 { margin: 0; }
  .credit { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .credit b { color: var(--accent); font-weight: 700; }

  /* ---- 버튼 ---- */
  button {
    font: inherit; color: inherit; cursor: pointer;
    background: var(--panel-hi);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    width: 100%;
    text-align: left;
    transition: background 120ms, border-color 120ms, opacity 120ms;
  }
  button:hover:not(:disabled) { background: #2b3042; border-color: #414964; }
  button:disabled { opacity: 0.42; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .feed {
    text-align: center; font-weight: 700; margin-top: 14px;
    background: linear-gradient(#2f9e6b, #248056); border-color: #3fb37e;
  }
  .feed:hover:not(:disabled) { background: linear-gradient(#37b57b, #2a9264); }

  /* ---- 일괄 구매 토글 ---- */
  .shophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .shophead h2 { margin: 0; }
  .modes { display: flex; gap: 4px; flex: none; }
  .modes button {
    width: auto; padding: 5px 9px;
    font-size: 11px; font-weight: 700;
    text-align: center;
    border-radius: 8px;
  }
  .modes button.on { background: var(--accent-dim); border-color: var(--accent); color: #eafff4; }

  .shop { display: flex; flex-direction: column; gap: 8px; }
  .up { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .up .name { font-weight: 600; font-size: 14px; }
  .up .desc { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .up .cost { font-size: 13px; font-weight: 700; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lv { font-size: 11px; color: var(--accent); font-weight: 700; }

  /* ---- 무기상점 ---- */
  /* 스탯 바로 아래, 왼쪽 정렬. button의 width:100%를 되돌려야 내용만큼만 차지한다 */
  .shoplink {
    width: auto;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600;
    padding: 9px 13px;
    margin-bottom: 14px;
  }
  .iconbtn {
    width: 38px; height: 38px; padding: 0;
    flex: none;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    text-align: center;
  }
  .stat .v.sm { font-size: 13px; }

  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    padding: 20px;
    background: #0009;
  }
  /* .modal이 display:grid라 기본 [hidden] 규칙을 이겨버린다 — 다시 눌러 준다 */
  .modal[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 460px; max-height: 82vh;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 24px 60px #000a;
  }
  .sheethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .sheethead h2 { margin: 0; font-size: 16px; color: var(--text); }
  .wlist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

  .w { display: flex; align-items: center; gap: 12px; }
  .wicon { font-size: 22px; flex: none; }
  .wmain { flex: 1; display: flex; flex-direction: column; gap: 3px; text-align: left; }
  .wname { font-weight: 600; font-size: 14px; }
  .wstat { font-size: 11px; color: var(--muted); }
  .wcost { font-size: 13px; font-weight: 700; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .w.locked .wcost { color: var(--muted); }
  .w.owned  .wcost { color: var(--accent); }
  .w.equipped { border-color: var(--accent-dim); background: #1f2a25; }
  .w.equipped .wcost { color: var(--accent); }
  /* 장착 중인 무기는 누를 일이 없어 비활성이지만, 흐려지면 오히려 눈에 안 띈다 */
  .w.equipped:disabled { opacity: 1; }

  .rebirth { margin-top: 14px; text-align: center; font-weight: 700; border-color: #6a4fa8; background: #2c2340; }
  .rebirth:hover:not(:disabled) { background: #3a2d55; }
  .note { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .warn { color: var(--gold); }

  /* 좁은 화면 보정.
     미디어쿼리도 특이도가 같으면 순서로 이긴다 — 위쪽 @media에 두면
     아래에 나오는 .hpwrap 기본 규칙에 밀린다. 그래서 끝에 모아 뒀다. */
  @media (max-width: 760px) {
    .hpwrap { width: 86px; }
    .tagwrap { width: 96px; }
    .ename { font-size: 9px; }
  }

  /* 멀미·발작 민감 사용자를 위한 OS 설정을 존중한다 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="game">
  <main>
    <div class="head">
      <h1>🟢 슬라임 키우기</h1>
      <div class="credit">제작자 <b>희선</b></div>
    </div>

    <div class="stats">

      <div class="stat"><div class="k">초당 젤리</div><div class="v" id="s-jps">0</div></div>

      <!-- .mover는 무대 전체 폭을 차지한다. translateX(%)가 자기 폭 기준으로

          <!-- 레벨별 확대는 .sizer가 맡는다. .slime에 직접 걸면

<div class="modal" id="wshop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wshop-title">

    <div class="wlist" id="wlist"></div>
    <p class="note">무기는 하나만 장착됩니다. 이미 산 무기를 누르면 그것으로 바꿔 낍니다.<br>
      <b>무기는 환생해도 사라지지 않습니다.</b></p>
  </div>
</div>

<script>
/* ============================================================
   1. 밸런스 데이터 — 가격과 표시 문구는 여기서 정한다.
      주의: 여기에 행을 넣으면 버튼과 가격까지만 생긴다.
      실제 효과는 아래 "3. 파생 수치"의 계산식에도 더해야 적용된다.
   ============================================================ */
// 크리티컬: 때릴 때 확률적으로 젤리를 배로 준다.
// 상한을 두는 이유는 100%가 되면 "확률"이라는 재미가 사라지고
// 손맛 업그레이드와 효과가 완전히 겹쳐버리기 때문이다.
const CRIT_MULT   = 2;      // 터졌을 때 배수
const CRIT_BASE   = 0.05;   // 업그레이드 0단계에서도 가끔 터져야 존재를 알아챈다
const CRIT_STEP   = 0.04;   // 단계당 상승폭
const CRIT_UP_CAP = 0.75;   // '행운'만으로 도달 가능한 상한 (18단계)
const CRIT_CAP    = 0.90;   // 무기까지 더한 전체 상한
// 최고 무기의 크리(+15%)를 더하면 정확히 CRIT_CAP에 닿는다.
// 이렇게 맞춰야 마지막 무기가 "이미 상한이라 의미 없는" 물건이 되지 않는다.
const critOf = n => Math.min(CRIT_UP_CAP, CRIT_BASE + CRIT_STEP * n);

const UPGRADES = [
  // id는 세이브의 키다. 표시 문구가 '쓰다듬기'에서 '때리기'로 바뀌어도
  // 'pat'을 그대로 둬야 기존 플레이어의 레벨이 날아가지 않는다.
  { id: 'pat',    name: '손맛',   base: 10,  growth: 1.15,
    desc: n => `때리기당 젤리 +${n + 1}` },
  { id: 'crit',   name: '행운',   base: 200, growth: 1.30,
    desc: n => `크리티컬 확률 ${(critOf(n) * 100).toFixed(0)}% · 젤리 x${CRIT_MULT}`,
    maxed: n => critOf(n) >= CRIT_UP_CAP },
  { id: 'field',  name: '젤리밭', base: 60,  growth: 1.18,
    desc: n => `초당 젤리 +${(n * 0.5).toFixed(1)}` },
  { id: 'digest', name: '소화력', base: 250, growth: 1.25,
    desc: n => `먹이 경험치 x${(1 + 0.25 * n).toFixed(2)}` },
  { id: 'power',  name: '힘 훈련', base: 120, growth: 1.22,
    desc: n => `공격력 +${n * 2}` },
  { id: 'vit',    name: '체력 단련', base: 90, growth: 1.20,
    desc: n => `최대 체력 +${n * 30}` },
];

/* 무기 — 업그레이드와 달리 한 번만 사고, 하나만 장착한다.
   요구 레벨이 20씩 올라가고 성능도 등급마다 계단식으로 뛴다.
   가격 증가율(약 15배)이 공격력 증가율(약 4.7배)보다 크기 때문에
   "다음 무기"는 항상 한참 모아야 하는 목표로 남는다.
   무기는 환생해도 사라지지 않는다(rebirth 참고) — 판이 갈려도
   남는 유일한 물건이라 상점이 장기 목표 역할을 한다. */
const WEAPONS = [
  { id: 'stick',  name: '나무 막대', icon: '🪵', level: 20,  cost: 1e3, atk: 15,    crit: 0.02 },
  { id: 'axe',    name: '돌 도끼',   icon: '🪓', level: 40,  cost: 1.2e4, atk: 70,  crit: 0.04 },
  { id: 'dagger', name: '녹슨 단검', icon: '🗡️', level: 60,  cost: 1.5e5, atk: 320, crit: 0.06 },
  { id: 'sword',  name: '강철 검',   icon: '⚔️', level: 80,  cost: 2e6, atk: 1500,  crit: 0.08 },
  { id: 'spear',  name: '화염 창',   icon: '🔥', level: 100, cost: 3e7, atk: 7000,  crit: 0.11 },
  { id: 'scythe', name: '영혼 낫',   icon: '🌙', level: 120, cost: 5e8, atk: 35000, crit: 0.15 },
];

// 몬스터 성장 곡선. 체력의 지수(1.55)가 보상의 지수(1.25)보다 크기 때문에
// 층이 올라갈수록 사냥이 느려지고, 그래서 공격력에 투자할 이유가 생긴다.
// 이 두 숫자의 차이가 전투 파트의 난이도 전체를 결정한다.
// 20층까지의 몬스터. 21층부터는 앞머리에 등급 수식어를 붙이며 다시 돈다.
const MONSTERS = [
  { name: '들쥐',      icon: '🐀' },
  { name: '박쥐',      icon: '🦇' },
  { name: '독거미',    icon: '🕷️' },
  { name: '독버섯',    icon: '🍄' },
  { name: '고블린',    icon: '👺' },
  { name: '들개',      icon: '🐺' },
  { name: '멧돼지',    icon: '🐗' },
  { name: '산적',      icon: '🥷' },
  { name: '전갈',      icon: '🦂' },
  { name: '바위 골렘', icon: '🗿' },
  { name: '독사',      icon: '🐍' },
  { name: '식인 상어', icon: '🦈' },
  { name: '미라',      icon: '🧟' },
  { name: '늪지 마녀', icon: '🧙' },
  { name: '원귀',      icon: '👻' },
  { name: '와이번',    icon: '🐉' },
  { name: '오우거',    icon: '👹' },
  { name: '크라켄',    icon: '🐙' },
  { name: '리치',      icon: '💀' },
  { name: '마왕',      icon: '😈' },
];
const TIERS = ['', '강화된 ', '흉포한 ', '심연의 ', '전설의 '];
// 기본 체력 10 + 기본 공격력 2 = 첫 몬스터를 5초에 잡는다.
// 시작 직후 첫 보상이 몇 초 안에 들어와야 플레이어가 남는다.
const hpOfStage     = s => Math.floor(10 * Math.pow(s, 1.55));
const rewardOfStage = s => Math.floor(8 * Math.pow(s, 1.25));
// 몬스터의 초당 피해. 지수를 체력(1.55)보다 훨씬 낮게 잡아, 층이 오를수록
// '못 이기는' 게 아니라 '오래 걸리는' 쪽으로 먼저 막히게 했다.
//
// 생존 조건은 단순하다: 초당 재생 >= 초당 피해면 절대 안 죽는다.
//   재생 = 최대체력 x 0.05,  피해 = 0.35 x 층^1.05
// 그래서 이 세 숫자의 관계가 "몇 층에서 막히는가"를 통째로 결정한다.
// 레벨 1 맨몸이 15층까지, 레벨 30이면 체력 단련 없이도 30층까지 버틴다.
const dmgOfStage    = s => 0.35 * Math.pow(s, 1.05);

const HP_REGEN = 0.05;   // 초당 최대 체력의 5% (완전 회복까지 20초)
const STUN_SEC = 2.5;    // 쓰러진 뒤 못 움직이는 시간
const RETREAT  = 3;      // 쓰러지면 물러나는 층 수
const monsterOf     = s => MONSTERS[(s - 1) % MONSTERS.length];
const tierOfStage   = s => Math.min(Math.floor((s - 1) / MONSTERS.length), TIERS.length - 1);
const nameOfStage   = s => TIERS[tierOfStage(s)] + monsterOf(s).name;

const REBIRTH_LEVEL = 20;     // 환생 가능 최소 레벨
const OFFLINE_CAP_H = 8;      // 오프라인 보상 상한(시간)
const SAVE_KEY = 'slime-idle-v1';

/* ============================================================
   2. 상태 — 저장되는 값은 전부 여기에만 둔다
   ============================================================ */
function freshState() {
  return {
    jelly: 0,
    level: 1,
    exp: 0,
    souls: 0,
    stage: 1,
    monsterHp: hpOfStage(1),
    hp: 120,           // 최대 체력은 slimeMaxHp()가 계산한다. load에서 상한을 맞춘다.
    // UPGRADES 표에서 자동으로 만든다 — 표에 행을 추가하면 여기도 따라온다
    up: Object.fromEntries(UPGRADES.map(u => [u.id, 0])),
    weapons: [],       // 보유한 무기 id 목록
    equipped: null,    // 장착 중인 무기 id (없으면 맨손)
    lastSeen: Date.now(),
  };
}
let state = freshState();

/* ============================================================
   3. 파생 수치 — 상태에서 계산만 하고 절대 저장하지 않는다
   ============================================================ */
const levelMult = () => 1 + 0.05 * (state.level - 1);
const soulMult  = () => 1 + 0.10 * state.souls;
const perClick  = () => (1 + state.up.pat) * levelMult() * soulMult();
const weaponOf   = () => WEAPONS.find(w => w.id === state.equipped) || null;
const weaponAtk  = () => weaponOf()?.atk ?? 0;
const weaponCrit = () => weaponOf()?.crit ?? 0;
const critChance = () => Math.min(CRIT_CAP, critOf(state.up.crit) + weaponCrit());
const perSec    = () => 0.5 * state.up.field * levelMult() * soulMult();
const expMult   = () => (1 + 0.25 * state.up.digest) * soulMult();
const atk        = () => (2 + 2 * state.up.power + weaponAtk()) * levelMult() * soulMult();
const slimeMaxHp = () => (120 + 30 * state.up.vit) * levelMult() * soulMult();
const expToNext = () => Math.floor(50 * Math.pow(state.level, 1.6));
// 한 번에 몇 단계씩 살지: 1 | 10 | 'max'.
// 게임 진행이 아니라 화면 조작 상태라 state에 넣지 않는다(= 세이브되지 않는다).
let buyMode = 1;

// k단계를 한꺼번에 살 때의 가격. 등비수열의 합이다.
//   base*g^n + base*g^(n+1) + ... = base*g^n * (g^k - 1) / (g - 1)
// k=1이면 예전의 낱개 가격과 정확히 같다.
const costOfMany = (u, k) => {
  const g = u.growth;
  return Math.floor(u.base * Math.pow(g, state.up[u.id]) * (Math.pow(g, k) - 1) / (g - 1));
};

// 지금 젤리로 살 수 있는 최대 단계 수. 위 식을 k에 대해 뒤집었다.
function affordable(u) {
  const g = u.growth, unit = u.base * Math.pow(g, state.up[u.id]);
  let k = Math.floor(Math.log(1 + state.jelly * (g - 1) / unit) / Math.log(g));
  if (!isFinite(k) || k < 0) k = 0;
  // 로그·부동소수 오차로 한두 개 어긋날 수 있어 실제 가격으로 맞춘다
  while (k > 0 && costOfMany(u, k) > state.jelly) k--;
  while (costOfMany(u, k + 1) <= state.jelly) k++;
  return k;
}

// 상한까지 남은 단계 수 (상한이 없는 업그레이드는 무한)
function roomLeft(u) {
  if (!u.maxed) return Infinity;
  let m = 0;
  while (m < 1000 && !u.maxed(state.up[u.id] + m)) m++;
  return m;
}

// 지금 이 버튼을 누르면 실제로 몇 단계가 오르는가.
// ×10을 골랐어도 젤리가 3단계치뿐이면 3단계만 산다 — 살 수 있는 만큼은
// 항상 사 주는 쪽이, 모자란다고 버튼을 잠가 두는 것보다 손이 덜 간다.
function stepsFor(u) {
  const want = buyMode === 'max' ? Infinity : buyMode;
  return Math.min(want, roomLeft(u), affordable(u));
}
const soulGain  = () => Math.max(1, Math.floor(Math.sqrt(state.level / 5)));

/* ============================================================
   4. 행동
   ============================================================ */
function hit(x, y) {
  const crit = Math.random() < critChance();
  const gain = perClick() * (crit ? CRIT_MULT : 1);
  state.jelly += gain;
  popText((crit ? '크리! +' : '+') + fmt(gain), x, y, crit);
  burst(x, y, crit);
  squish();
  hurtFace();
}

function feed() {
  if (state.jelly < 1) return;
  state.exp += state.jelly * expMult();
  state.jelly = 0;
  let leveled = false;
  while (state.exp >= expToNext()) {
    state.exp -= expToNext();
    state.level++;
    leveled = true;
  }
  if (leveled) note(`레벨 ${state.level} 달성! 모든 젤리 획득량 x${levelMult().toFixed(2)}`);
  squish();
}

/* 서로 초당 피해를 주고받는다. 슬라임이 쓰러지면 몇 층 물러나 기절했다가
   완전 회복하고 다시 붙는다. 진행을 되돌리는 벌이 아니라 속도 제한 장치다 —
   방치형에서 진척이 크게 날아가면 그 자리에서 게임을 접는다. */
let stunLeft = 0;   // 기절 남은 시간(초). 연출용이라 저장하지 않는다.

function fight(dt) {
  if (stunLeft > 0) { stunLeft = Math.max(0, stunLeft - dt); return; }

  const max = slimeMaxHp();
  state.hp = Math.min(max, state.hp + max * HP_REGEN * dt);
  state.hp -= dmgOfStage(state.stage) * dt;
  if (state.hp <= 0) {
    state.stage = Math.max(1, state.stage - RETREAT);
    state.monsterHp = hpOfStage(state.stage);
    state.hp = slimeMaxHp();
    stunLeft = STUN_SEC;
    note(`슬라임이 쓰러졌습니다. ${state.stage}층으로 물러납니다.`, true);
    return;
  }

  state.monsterHp -= atk() * dt;
  // 공격력이 높으면 한 프레임에 여러 마리를 넘길 수 있어 반복 처리한다.
  // guard는 혹시 체력이 0 이하로 굳었을 때 화면이 멈추는 것을 막는 안전장치다.
  for (let guard = 0; state.monsterHp <= 0 && guard < 500; guard++) {
    state.jelly += rewardOfStage(state.stage);
    state.stage++;
    state.monsterHp += hpOfStage(state.stage);
  }
}

function buy(u) {
  const k = stepsFor(u);
  if (k < 1) return;
  state.jelly -= costOfMany(u, k);   // stepsFor가 이미 살 수 있는 만큼만 돌려준다
  state.up[u.id] += k;
}

// 무기 한 자루를 사거나, 이미 가진 무기로 갈아 끼운다.
function buyWeapon(w) {
  if (state.weapons.includes(w.id)) { state.equipped = w.id; return; }
  if (state.level < w.level) return;
  if (state.jelly < w.cost) return;
  state.jelly -= w.cost;
  state.weapons.push(w.id);
  state.equipped = w.id;   // 방금 산 무기는 바로 들려 준다
  note(`${w.icon} ${w.name}을(를) 손에 넣었습니다!`);
}

function rebirth() {
  if (state.level < REBIRTH_LEVEL) return;
  const gained = soulGain();
  const souls = state.souls + gained;
  // 무기는 영혼과 함께 판을 넘어 살아남는다. 매번 다시 사야 한다면
  // 5억짜리 낫을 살 이유가 없어지고 상점 자체가 죽는다.
  const { weapons, equipped } = state;
  state = freshState();
  state.souls = souls;
  state.weapons = weapons;
  state.equipped = equipped;
  state.hp = slimeMaxHp();
  stunLeft = 0;
  note(`환생! 영혼 ${gained}개를 얻어 전체 배율이 x${soulMult().toFixed(2)}가 되었습니다.`);
}

/* ============================================================
   5. 루프 — 로직은 dt(초) 기반, 렌더는 매 프레임
   ============================================================ */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.25);  // 탭 복귀 시 폭주 방지
  last = now;
  state.jelly += perSec() * dt;
  fight(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   6. 렌더 — 상태를 화면에 비추기만 한다
   ============================================================ */
const $ = id => document.getElementById(id);
const shopEl = $('shop');

// 업그레이드 버튼은 최초 1회만 만들고, 이후엔 내용만 갱신한다.
const rows = UPGRADES.map(u => {
  const b = document.createElement('button');
  b.className = 'up';
  b.innerHTML = `<span><span class="name">${u.name}</span> <span class="lv"></span>
                 <div class="desc"></div></span><span class="cost"></span>`;
  b.onclick = () => buy(u);
  shopEl.appendChild(b);
  return { u, b, lv: b.querySelector('.lv'), desc: b.querySelector('.desc'), cost: b.querySelector('.cost') };
});

// 무기 목록도 최초 1회만 만든다
const wlistEl = $('wlist');
const wrows = WEAPONS.map(w => {
  const b = document.createElement('button');
  b.className = 'w';
  b.innerHTML = `<span class="wicon">${w.icon}</span>
                 <span class="wmain"><span class="wname">${w.name}</span>
                 <span class="wstat"></span></span><span class="wcost"></span>`;
  b.onclick = () => buyWeapon(w);
  wlistEl.appendChild(b);
  return { w, b, stat: b.querySelector('.wstat'), cost: b.querySelector('.wcost') };
});

function renderShop() {
  for (const r of wrows) {
    const owned    = state.weapons.includes(r.w.id);
    const equipped = state.equipped === r.w.id;
    const locked   = !owned && state.level < r.w.level;
    r.stat.textContent = `공격력 +${fmt(r.w.atk)} · 크리 +${(r.w.crit * 100).toFixed(0)}%`;
    r.cost.textContent = equipped ? '장착중'
                       : owned    ? '장착'
                       : locked   ? `레벨 ${r.w.level} 필요`
                       : fmt(r.w.cost);
    r.b.classList.toggle('owned', owned);
    r.b.classList.toggle('equipped', equipped);
    r.b.classList.toggle('locked', locked);
    r.b.disabled = equipped || (!owned && (locked || state.jelly < r.w.cost));
  }
}

function render() {
  const need = expToNext();
  $('s-jelly').textContent = fmt(state.jelly);
  $('s-jps').textContent   = fmt(perSec());
  $('s-level').textContent = state.level;
  $('s-atk').textContent   = fmt(atk());
  $('s-crit').textContent  = (critChance() * 100).toFixed(0) + '%';
  const wp = weaponOf();
  $('s-weapon').textContent = wp ? `${wp.icon} ${wp.name}` : '맨손';
  // 닫혀 있는 창을 매 프레임 갱신할 이유는 없다
  if (!$('wshop').hidden) renderShop();

  const maxHp = hpOfStage(state.stage);
  const hp = Math.max(0, state.monsterHp);
  $('s-floor').textContent  = `${state.stage}층`;
  $('e-hp').textContent     = `${fmt(hp)} / ${fmt(maxHp)}`;
  $('e-hpbar').style.width  = Math.min(100, hp / maxHp * 100) + '%';
  $('s-lvtag').textContent  = `Lv.${state.level}`;

  const shp = Math.max(0, state.hp), shpMax = slimeMaxHp();
  const shpPct = Math.min(100, shp / shpMax * 100);
  $('s-hpnum').textContent = `${fmt(shp)} / ${fmt(shpMax)}`;
  $('s-hpbar').style.width = shpPct + '%';
  $('s-hpwrap').classList.toggle('low', shpPct < 35);
  $('slime').classList.toggle('ko', stunLeft > 0);
  $('stage').classList.toggle('stunned', stunLeft > 0);

  $('s-weap').textContent = wp ? wp.icon : '';

  renderArena();
  $('s-exp').textContent   = `${fmt(state.exp)} / ${fmt(need)}`;
  $('s-expbar').style.width = Math.min(100, state.exp / need * 100) + '%';
  $('feed').disabled = state.jelly < 1;
  $('s-souls').textContent = state.souls;
  $('s-soulmult').textContent = 'x' + soulMult().toFixed(2);

  for (const r of rows) {
    const n = state.up[r.u.id];
    const room = roomLeft(r.u);        // 0이면 상한까지 다 찍었다
    const k = stepsFor(r.u);           // 지금 누르면 실제로 오르는 단계 수
    // 못 사는 상황에서도 다음 한 단계 가격은 보여 줘야 목표가 생긴다
    const shown = Math.max(1, k);
    r.lv.textContent = n ? `Lv.${n}` : '';
    r.desc.textContent = r.u.desc(n);
    r.cost.textContent = room === 0 ? 'MAX'
                       : shown > 1   ? `×${shown} · ${fmt(costOfMany(r.u, shown))}`
                       : fmt(costOfMany(r.u, 1));
    r.b.disabled = k < 1;
  }

  const rb = $('rebirth');
  rb.disabled = state.level < REBIRTH_LEVEL;
  rb.textContent = rb.disabled
    ? `환생 — 레벨 ${REBIRTH_LEVEL} 필요`
    : `환생 — 영혼 +${soulGain()}`;

  // 레벨이 오를수록 커지고 색이 변한다.
  // 색조는 .slime에만 건다 — .sizer에 걸면 그 안의 무기 이모지까지 물든다.
  $('sizer').style.transform = `scale(${slimeScale().toFixed(3)})`;
  $('slime').style.filter = `hue-rotate(${(state.level - 1) * 7}deg)`;

  // 슬라임이 커지면 멈춰야 할 지점도 앞당겨진다
  if (state.level !== shownLevel) { shownLevel = state.level; layoutArena(); }
}

// 상한을 두지 않으면 후반에 슬라임이 몬스터를 덮는다
const slimeScale = () => Math.min(1.4, 1 + Math.log10(state.level) * 0.45);
const SLIME_W = 92;    // .slime의 CSS 폭. 배율을 곱해 실제 폭을 낸다.
const WALK_PAD = 24;   // 몬스터 앞에 남길 여유. 달려들기(15px)가 여기서 소모된다.
const WEAP_OVERHANG = 14;  // 무기가 슬라임 오른쪽으로 삐져나오는 폭

/* 슬라임이 전진할 거리를 실측해 --walk에 넣는다.
   transform은 offsetLeft/offsetWidth에 영향을 주지 않으므로,
   전진 애니메이션을 끄지 않고도 '전진 전' 좌표를 그대로 읽을 수 있다. */
let shownLevel = -1;
function layoutArena() {
  const unit = document.querySelector('.unit');
  const foe = $('foe'), body = $('e-body'), hpwrap = document.querySelector('.hpwrap');
  const scale = slimeScale();
  // 오른쪽으로 가장 많이 튀어나온 것을 기준으로 잡는다.
  // 몸통+무기는 배율을 받고, 이름표·체력바는 받지 않는다.
  const half = Math.max((SLIME_W / 2 + WEAP_OVERHANG) * scale,
                        document.querySelector('.tagwrap').offsetWidth / 2);
  const slimeRight = unit.offsetLeft + unit.offsetWidth / 2 + half;
  const foeCenter = foe.offsetLeft + foe.offsetWidth / 2;
  // 몸통과 체력바 중 더 왼쪽으로 튀어나온 쪽을 기준으로 멈춘다
  const obstacle = foeCenter - Math.max(body.offsetWidth, hpwrap.offsetWidth) / 2;
  $('stage').style.setProperty('--walk', Math.max(0, obstacle - slimeRight - WALK_PAD) + 'px');
}

/* 층이 바뀔 때만 몬스터를 갈아 끼우고 등장·전진 연출을 다시 튼다.
   한 프레임에 여러 층을 넘기더라도(공격력이 높으면 그렇다) 마지막 상태 한 번만
   그리면 되므로, state.stage와 화면에 그려진 층을 비교하는 것으로 충분하다. */
let shownStage = -1;
function renderArena() {
  if (state.stage === shownStage) return;
  const first = shownStage === -1;
  shownStage = state.stage;

  const foe = $('foe');
  $('e-name').textContent = nameOfStage(state.stage);
  $('e-body').textContent = monsterOf(state.stage).icon;

  const t = tierOfStage(state.stage);
  for (let i = 1; i <= 4; i++) foe.classList.toggle('t' + i, t === i);

  if (!first) slainFx();
  restartAnim(foe, 'entering');
  restartAnim($('mover'), 'advancing');
}

// 클래스를 다시 붙이는 것만으로는 애니메이션이 처음부터 돌지 않는다.
// 사이에 리플로우를 한 번 강제해야 브라우저가 새 애니메이션으로 인식한다.
function restartAnim(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function slainFx() {
  const el = document.createElement('div');
  el.className = 'slainfx';
  el.textContent = '💥';
  $('foe').appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

/* ============================================================
   7. 표시 형식 — 방치형은 숫자가 금방 커지므로 필수
   ============================================================ */
const UNITS = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 ? (Math.round(n * 10) / 10).toString() : Math.floor(n).toString();
  const tier = Math.min(Math.floor(Math.log10(n) / 3), UNITS.length - 1);
  return (n / Math.pow(1000, tier)).toFixed(2) + UNITS[tier];
}

/* ============================================================
   8. 저장 / 불러오기 / 오프라인 보상
   ============================================================ */
function save() {
  state.lastSeen = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch {
    note('저장에 실패했습니다. 로컬 서버로 열면 해결됩니다.', true);
  }
}

function load() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch { return; }
  if (!raw) return;
  let saved;
  try {
    // 세이브에 없는 필드는 기본값으로 채운다 — 업데이트 후에도 옛 세이브가 살아남게.
    saved = JSON.parse(raw);
    state = { ...freshState(), ...saved, up: { ...freshState().up, ...(saved.up || {}) } };
  } catch {
    return;
  }
  const secs = Math.max(0, (Date.now() - state.lastSeen) / 1000);
  const capped = Math.min(secs, OFFLINE_CAP_H * 3600);

  // 체력 이전에 저장된 세이브는 hp 필드가 없다 → 가득 채워서 시작한다.
  // 있으면 자리 비운 동안의 재생을 적용하고 현재 상한으로 자른다.
  const max = slimeMaxHp();
  state.hp = typeof saved.hp === 'number'
    ? Math.min(max, saved.hp + max * HP_REGEN * capped)
    : max;

  const earned = perSec() * capped;
  if (earned >= 1) {
    state.jelly += earned;
    note(`자리를 비운 ${Math.floor(capped / 60)}분 동안 젤리 ${fmt(earned)}를 모았습니다.`);
  }
}

let noteTimer;
function note(msg, warn = false) {
  const el = $('note');
  el.textContent = msg;
  el.className = warn ? 'note warn' : 'note';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { el.textContent = ''; }, 6000);
}

/* ============================================================
   9. 연출 (juice) — 게임의 손맛은 대부분 여기서 나온다
   ============================================================ */
const stage = $('stage');
function squish() {
  const s = $('slime');
  s.classList.add('squish');
  setTimeout(() => s.classList.remove('squish'), 90);
}

// 맞은 표정(눈 ><, 벌어진 입, 붉은 기운).
// 스쿼시(90ms)보다 길게 잡아야 표정이 읽힌다. 연타하면 타이머가
// 계속 밀려서 때리는 동안 계속 찡그린 얼굴로 남는다.
let hurtTimer;
function hurtFace() {
  const s = $('slime');
  s.classList.add('hurt');
  clearTimeout(hurtTimer);
  hurtTimer = setTimeout(() => s.classList.remove('hurt'), 260);
}
// 누른 자리에 파문 + 젤리 방울을 뿌린다.
// 방치형에서 '누르는 맛'은 숫자가 아니라 대부분 여기서 나온다.
function burst(x, y, crit) {
  const r = stage.getBoundingClientRect();
  const left = x - r.left, top = y - r.top;

  const add = (cls, build) => {
    const el = document.createElement('div');
    el.className = crit ? `fx ${cls} crit` : `fx ${cls}`;
    build(el);
    stage.appendChild(el);
    // 애니메이션이 끝나면 스스로 사라진다. 이게 없으면 노드가 무한히 쌓인다.
    el.addEventListener('animationend', () => el.remove());
  };

  add('ring', el => { el.style.left = left + 'px'; el.style.top = top + 'px'; });

  for (let i = 0, n = crit ? 10 : 5; i < n; i++) {
    add('bit', el => {
      // 위쪽 반원으로 튀었다가 중력에 끌려 아래로 떨어지는 궤적
      const ang  = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
      const dist = (crit ? 44 : 30) + Math.random() * 26;
      el.style.left = left + 'px';
      el.style.top  = top + 'px';
      el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(ang) * dist + 34 + 'px');
      el.style.animationDelay = Math.random() * 60 + 'ms';
    });
  }

  if (crit) {
    add('flash', el => {
      el.style.setProperty('--fx', left + 'px');
      el.style.setProperty('--fy', top + 'px');
    });
    // 폰에서 손가락으로 누를 때의 확인 신호. 지원 안 하는 기기는 그냥 무시한다.
    navigator.vibrate?.(18);
  }
}

function popText(text, x, y, crit = false) {
  const p = document.createElement('div');
  p.className = crit ? 'pop crit' : 'pop';
  p.textContent = text;
  const r = stage.getBoundingClientRect();
  p.style.left = (x - r.left - 12) + 'px';
  p.style.top  = (y - r.top - 12) + 'px';
  stage.appendChild(p);
  p.addEventListener('animationend', () => p.remove());
}

/* ============================================================
   10. 연결
   ============================================================ */
stage.addEventListener('pointerdown', e => hit(e.clientX, e.clientY));
$('feed').onclick = feed;
$('modes').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  buyMode = b.dataset.mode === 'max' ? 'max' : Number(b.dataset.mode);
  for (const el of $('modes').children) el.classList.toggle('on', el === b);
});

const wshop = $('wshop');
const openShop  = () => { wshop.hidden = false; renderShop(); };
const closeShop = () => { wshop.hidden = true; };
$('shopbtn').onclick = openShop;
$('wshop-close').onclick = closeShop;
// 시트 바깥(어두운 배경)을 눌렀을 때만 닫는다
wshop.addEventListener('pointerdown', e => { if (e.target === wshop) closeShop(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !wshop.hidden) closeShop(); });

$('rebirth').onclick = () => {
  if (confirm(`환생하면 레벨과 업그레이드가 초기화됩니다. 영혼 ${soulGain()}개를 얻습니다. 계속할까요?`)) rebirth();
};

load();
layoutArena();
addEventListener('resize', layoutArena);
setInterval(save, 5000);
addEventListener('beforeunload', save);
requestAnimationFrame(frame);
</script>
</body>
</html>
